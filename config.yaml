seed: 42

paths:
  auth_gz: data/raw/auth.txt.gz
  redteam_gz: data/raw/redteam.txt.gz
  aggregates: data/derived/aggregates.pkl
  graph: data/derived/graph.pkl
  redteam_full: data/derived/redteam_full.csv
  redteam_fit: data/derived/redteam_fit.csv
  redteam_holdout: data/derived/redteam_holdout.csv
  profile: data/derived/redteam_profile.json
  target_validation: data/derived/target_validation.json

campaign_gap_seconds: 14400   # 4h (SETTLED). 1h fallback = 3600.

split:
  fit_fraction: 0.70          # earliest 70% of the timeline goes to fit

graph:
  server_in_degree_percentile: 90   # top-decile in-degree ...
  server_min_in_out_ratio: 3.0      # ... AND receives >> initiates
  target_keep_ratio: 2.0            # keep is_server proxy if targets' median in-degree >= 2x all-hosts

benchmark_rows: 10000000      # ~10M rows for the extrapolation
expected_total_rows: 1050000000
max_full_pass_hours: 4        # §5 fallback trigger
collection_days: 58

# Day-2 / Day-3 knobs, placed here now so the file is stable
alpha: 1.0
beta: 1.0
base_rate: 0.0001

# Day-2 fan-out generator knobs
fanout:
  min_foothold_out_degree: 25   # a foothold must have >= this many real out-edges
                                # (smallest real red-team seed out-degree ~29)
  max_harvest_creds: 60         # cap credentials pulled from a foothold (real max ~45)
  credential_bonus: 2.0         # multiplier for a target where a compromised cred is seen
  n_campaigns: 10000            # corpus size for the Day-2 scale run / exit criterion

# Day-3 writer / benign / mixed-corpus knobs
day3:
  synth_auth: data/derived/synth_auth.csv
  synth_labels: data/derived/synth_labels.csv
  benign_fit: data/derived/benign_fit.csv
  benign_holdout: data/derived/benign_holdout.csv
  fit_window: [0, 1758226]          # benign train negatives: time <= fit max
  holdout_window: [1847858, 2557047] # benign test negatives: holdout span
  benign_n: 1500000                  # random benign rows per window
  collection_seconds: 5011200        # 58-day window; campaign start kept inside it
  base_rates:                        # malicious:benign ratios for the mixed-corpus sweep
    - {name: "1e2", rate: 0.01}
    - {name: "1e3", rate: 0.001}
    - {name: "1e4", rate: 0.0001}

# Day-4 scarcity, evaluation, and validation knobs
day4:
  scarcity_k: [1, 2, 4, 8, 13]      # k real red-team FIT campaigns drawn per seed, out of 13 (scarcity curve)
  n_seeds: 5                         # random seeds per k-value (reproducibility)

  # Holdout base-rate sweep (test-time axis): rebalance holdout benign to hit ratios.
  # null = natural floor (all 204,228 holdout benign; ~1:4000 ratio).
  # Always keep all 51 real holdout positives.
  holdout_base_rates: [0.01, 0.001, null]

  # GBT hyperparameters: shallow (depth ~3), modest n_estimators, regularized
  gbt:
    max_depth: 3
    n_estimators: 100
    learning_rate: 0.1
    subsample: 0.8
    min_samples_split: 10
    min_samples_leaf: 5

  near_dup_threshold: 0.5            # Jaccard threshold: synth campaign counted a near-duplicate of a fit campaign above this
  figures_dir: docs/figures/         # scarcity curve, histograms, hourly plots
  results_json: data/derived/day4_results.json
  validation_report: docs/validation_report.md
